name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtimes:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1.5", "5.2.4", "5.3.6", "5.4.8", "5.5.1", "luajit"]
    steps:
      - uses: actions/checkout@v6
      - name: Build verified Lua and LuaRocks sources
        run: tools/ci-toolchain.sh "${{ matrix.lua }}"
      - name: Install pure Lua test dependencies
        run: |
          luarocks --tree ./lua_modules install dkjson 2.11-1
          luarocks --tree ./lua_modules install luaunit 3.5-1
      - run: make test TEST_ARGS="-p TestSDK"
  packaging-and-tls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build verified Lua and LuaRocks sources
        run: tools/ci-toolchain.sh 5.4.8
      - run: make package
