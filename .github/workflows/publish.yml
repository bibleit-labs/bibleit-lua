name: Publish to LuaRocks

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without v)
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: luarocks-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            version="${TAG#v}"
          else
            version="$MANUAL_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: v${{ steps.release.outputs.version }}
          persist-credentials: false
      - name: Build verified Lua and LuaRocks sources
        run: tools/ci-toolchain.sh 5.4.8
      - name: Test, package and publish
        env:
          VERSION: ${{ steps.release.outputs.version }}
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: make publish VERSION="$VERSION"
